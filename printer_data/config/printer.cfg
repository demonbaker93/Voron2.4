# This file contains common pin mappings for the BigTreeTech Octopus
# Pro v1.1 board.

# Important! Do not use this config with an Octopus Pro v1.0 board nor
# non-Pro board.

# To use this config, during "make menuconfig", select "Enable
# low-level configuration options", select the STM32H723
# micro-controller, select a "128KiB bootloader", and select a "25Mhz
# crystal".

# See docs/Config_Reference.md for a description of parameters.
[include mainsail.cfg]

# Driver0
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 40
endstop_pin: PG6
position_endstop: 0
position_max: 200
homing_speed: 50

# Driver1
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
endstop_pin: PG9
position_endstop: 0
position_max: 200
homing_speed: 50

# Driver2
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 8
endstop_pin: PG10
position_endstop: 0.5
position_max: 200

# Driver3
# The Octopus only has 4 heater outputs which leaves an extra stepper
# This can be used for a second Z stepper, dual_carriage, extruder co-stepper,
# or other accesory such as an MMU
#[stepper_]
#step_pin: PG4
#dir_pin: PC1
#enable_pin: !PA2
#endstop_pin: PG11
#...

# Driver4
[extruder]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA0 # HE0
sensor_pin:  PF4 # T0
sensor_type: EPCOS 100K B57560G104F
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: -200
max_temp: 250

#[filament_switch_sensor material_0]
#switch_pin: PG12

# Driver5
#[extruder1]
#step_pin: PC13
#dir_pin: PF0
#enable_pin: !PF1
#heater_pin: PA3 # HE1
#sensor_pin: PF5 # T1
#...

#[filament_switch_sensor material_1]
#switch_pin: PG13

# Driver6
#[extruder2]
#step_pin: PE2
#dir_pin: PE3
#enable_pin: !PD4
#heater_pin: PB0 # HE2
#sensor_pin: PF6 # T2
#...

#[filament_switch_sensor material_2]
#switch_pin: PG14

# Driver7
#[extruder3]
#step_pin: PE6
#dir_pin: PA14
#enable_pin: !PE0
#heater_pin: PB11 # HE3
#sensor_pin: PF7 # T3
#...

#[filament_switch_sensor material_3]
#switch_pin: PG15

[heater_bed]
heater_pin: PA1
sensor_pin: PF3 # TB
sensor_type: ATC Semitec 104GT-2
control: watermark
min_temp: -200
max_temp: 130

[fan]
pin: PA8

#[heater_fan fan1]
#pin: PE5

#[heater_fan fan2]
#pin: PD12

#[heater_fan fan3]
#pin: PD13

#[heater_fan fan4]
#pin: PD14

#[controller_fan fan5]
#pin: PD15

# Octopus_MCU temperature monitoring 
[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

# raspberry_pi-mcu temperature monitoring 
[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100




[mcu]
#serial: /dev/serial/by-id/usb-Klipper_Klipper_firmware_12345-if00
canbus_uuid=82b80d1b9217

[mcu toolhead]
canbus_uuid: 58be1f4594cc


[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

#####################################################################
#   FYSETC H36 Combo V2.0 Pinout Configuration
#####################################################################

[mcu toolhead]
canbus_uuid: 58be1f4594cc

# On-board temperature sensor tracking toolhead MCU temps
[temperature_sensor Toolhead_MCU]
sensor_type: temperature_mcu
sensor_mcu: toolhead

# On-board ADXL345 Input Shaper accelerometer
[adxl345]
cs_pin: toolhead:PA4
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
probe_points:
    175, 175, 20  # Change these to match your exact bed center layout

#####################################################################
#   Extruder Motor & Hotend Control
#####################################################################

[extruder]
step_pin: toolhead:PA5
dir_pin: toolhead:PA6        # Add an exclamation mark if your extruder feeds backwards (!PA6)
enable_pin: !toolhead:PA7
microsteps: 16
rotation_distance: 22.6789   # Adjust this configuration to match your exact Extruder model
nozzle_diameter: 0.400
filament_diameter: 1.750

# Hotend Heater
heater_pin: toolhead:PB13
max_power: 1.0

# Hotend Thermistor 
sensor_type: ATC Semitec 104NT-4-R025H42G  # Change to match your specific hotend thermistor
sensor_pin: toolhead:PA3
pullup_resistor: 2200        # The board uses an updated 2.2K pull-up resistor

control: pid                 # Run a fresh PID tune once initialization finishes
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 300

[tmc2209 extruder]
uart_pin: toolhead:PA15
run_current: 0.600
stealthchop_threshold: 0

#####################################################################
#   Fans & Cooling
#####################################################################

# Part Cooling Fan (FAN0)
[fan]
pin: toolhead:PB12

# Hotend Fan (FAN1)
[heater_fan hotend_fan]
pin: toolhead:PB2
heater: extruder
heater_temp: 50.0

# Enclosure / Aux Fan (FAN2)
# [fan_generic auxiliary_fan]
# pin: toolhead:PB0

#####################################################################
#   Probes & Endstops (Uncomment and edit as needed)
#####################################################################

# X-Endstop / Toolhead Sensor Interface (IO.0)
# [stepper_x]
# endstop_pin: toolhead:PB3

# Z-Probe Interface (IO.2 - e.g., Tap, Klicky, Inductive)
# [probe]
# pin: !toolhead:PB5
# z_offset: 0

# Onboard Stealthburner RGB (IO.3/RGB0)
# [neopixel toolhead_leds]
# pin: toolhead:PA10
# chain_count: 3
# color_order: GRBW


